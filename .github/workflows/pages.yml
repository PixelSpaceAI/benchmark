name: Deploy benchmark dashboard

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "bfcl-malay-bench/results/comparison.json"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "bfcl-malay-bench/results/comparison.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Test site build
        run: python -m unittest discover -s site/tests -v
      - name: Validate JavaScript
        run: node --check site/app.js
      - name: Build site
        run: python site/build.py --output _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
